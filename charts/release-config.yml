charts:
  bdv:
    path: charts/bdv
    namespace: bdv
    bump: minor
    minimum_source_version: 0.1.34
    tests:
      - [bash, charts/bdv/scripts/test-all.sh]
  postfix-relay:
    path: charts/postfix-relay
    namespace: app-mail
    bump: patch
    set:
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  ddc-pme:
    path: charts/ddc-pme
    namespace: ddc-pme
    bump: patch
    # Synthetic values so lint/template work offline: the chart requires an
    # immutable image tag and checks pre-existing Secrets with `lookup`, which
    # returns nothing without a cluster. Never used for a real release.
    set:
      global.imageTag: ci-validate
      secretValidation.allowOffline: "true"
  ddc-innovation-pm:
    path: charts/ddc-innovation-pm
    namespace: ddc-pm
    bump: patch
    set:
      image.tag: abcdef0
