{{- include "dcipm.guardAll" . -}}
{{- /*
Web Deployment â€” the React bundle served by nginx.

  * Serves plain HTTP on :80. The nginx config in the image forwards
    X-Forwarded-Proto, preserving the browser's https as it came from HAProxy
    rather than overwriting it with the container's local scheme.
  * `proxy_pass http://api:8080` is inside the image, which is why the API
    Service is named `api` (see service-api.yaml, risk R6).
  * Two replicas are safe here: static files, no background workers, no leader
    election needed. (The API's count of 1 is a correctness constraint, not a
    sizing one.)

NON-ROOT: nginx:1.27-alpine serves as uid 101 and writes /var/cache/nginx and
/var/run/nginx.pid. A non-root container therefore needs those paths writable,
which the emptyDir mounts below provide. If the image is rebuilt in a way that
cannot start this way, set web.podSecurityContext to {} and record the exception
in the deployment notes rather than leaving the pod in CrashLoop.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcipm.web.fullname" . }}
  namespace: {{ include "dcipm.namespace" . }}
  labels:
    {{- include "dcipm.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
  {{- with (include "dcipm.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: {{ .Values.web.revisionHistoryLimit | default 5 }}
  strategy:
    {{- toYaml .Values.web.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "dcipm.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dcipm.componentLabels" (dict "root" $ "component" "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dcipm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "dcipm.web.image" . | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          {{- /*
            VITE_API_BASE_URL is baked into the JS bundle at IMAGE BUILD time
            (Dockerfile.web ARG), so this env var changes nothing at runtime. It
            is set so that `kubectl describe pod` shows the contract the running
            image is supposed to have been built with, which makes a "the UI is
            calling the wrong endpoint" investigation start from evidence.
          */}}
          env:
            {{- range $key, $value := .Values.web.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.web.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.web.probes.readiness.enabled }}
          # The root path is the only route that must exist; nginx answers it from
          # the SPA bundle, so a 200 here proves the bundle is being served.
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.web.cacheVolume.enabled .Values.web.runVolume.enabled }}
          volumeMounts:
            {{- if .Values.web.cacheVolume.enabled }}
            - name: nginx-cache
              mountPath: {{ .Values.web.cacheVolume.mountPath }}
            {{- end }}
            {{- if .Values.web.runVolume.enabled }}
            - name: nginx-run
              mountPath: {{ .Values.web.runVolume.mountPath }}
            {{- end }}
          {{- end }}
      {{- if or .Values.web.cacheVolume.enabled .Values.web.runVolume.enabled }}
      volumes:
        {{- if .Values.web.cacheVolume.enabled }}
        - name: nginx-cache
          emptyDir: {{ toJson .Values.web.cacheVolume.emptyDir }}
        {{- end }}
        {{- if .Values.web.runVolume.enabled }}
        - name: nginx-run
          emptyDir: {{ toJson .Values.web.runVolume.emptyDir }}
        {{- end }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
