{{- include "dcipm.guardAll" . -}}
{{- if .Values.secrets.create -}}
{{- /*
OPTIONAL Secret creation. OFF by default, and off is the correct answer here.

WHY OFF: Helm stores every value of every revision in the release Secret, so
`helm get values -r <n>` reproduces a value from three upgrades ago -- after
`uninstall`, and after `rollback`. A connection string passed with --set or left
in a values file is therefore persisted in the cluster repeatedly, readable by
anyone with get-secrets on the namespace. Plan decision D10 and risk R13 keep the
credential OUTSIDE the chart: `deploy-dcipm.yml` writes `dcipm-db` from the
controller environment, and this chart references it BY NAME. That is also what
makes `api.dbSecretName` the existingSecret escape hatch the deploy already uses.

WHY THE OPTION EXISTS: a first install in a fresh namespace, a render that asserts
the full object set, and environments with no out-of-band secret manager.
When enabled the created Secret takes the name the workloads ALREADY reference
(api.dbSecretName / api.authSecretName), so there is still exactly one place that
names a Secret and nothing about the Deployment changes.

THE CONSEQUENCE OF ENABLING IT: Helm takes OWNERSHIP. `helm uninstall` then
DELETES the Secret and the API returns with no connection string, and the Ansible
playbook that used to write it starts fighting Helm over the same object. Both
outcomes are invisible on the day you enable it. So `secrets.takeOwnership: true`
is required alongside `create` (see the guard in _helpers.tpl): a second flag is
the cheapest way to make "I understand Helm will delete this" a deliberate act
rather than a default someone discovers during an uninstall.

Every rendered value traces to .Values -- nothing is generated, nothing is read
from the cluster, and nothing here is ever populated from the ConfigMap.
*/ -}}
{{- $db := .Values.secrets.api | default dict -}}
{{- $auth := .Values.secrets.auth | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "secrets.create requires api.dbSecretName to name the Secret the Deployment mounts" .Values.api.dbSecretName | quote }}
  namespace: {{ include "dcipm.namespace" . }}
  labels:
    {{- include "dcipm.componentLabels" (dict "root" $ "component" "api") | nindent 4 }}
  {{- with (include "dcipm.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
# stringData, not data. Values files hold plain text and Kubernetes converts on
# apply, so nobody is asked to base64 by hand -- a half-encoded round is a
# "password is wrong" error that outlives the deploy that caused it.
stringData:
  {{- range $k, $v := $db }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- if gt (len $auth) 0 }}
---
# Rendered only when keys are supplied. Without them the auth Secret stays
# exactly as it is today: referenced by name and marked optional, so its absence
# costs role grants but never blocks a deploy.
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "secrets.auth has keys but api.authSecretName is empty" .Values.api.authSecretName | quote }}
  namespace: {{ include "dcipm.namespace" . }}
  labels:
    {{- include "dcipm.componentLabels" (dict "root" $ "component" "api") | nindent 4 }}
  {{- with (include "dcipm.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $k, $v := $auth }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
