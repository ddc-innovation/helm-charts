{{- include "dcipm.guardAll" . -}}
{{- /*
Web Service â€” named `web`, port 80.

Referenced by the Ingress root path and by the documented reachability command
for an Ingress-less (dev) render: `kubectl port-forward svc/web 8080:80`.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcipm.web.serviceName" . }}
  namespace: {{ include "dcipm.namespace" . }}
  labels:
    {{- include "dcipm.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
  {{- with .Values.webService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.webService.type }}
  ports:
    - name: http
      port: {{ .Values.webService.port }}
      targetPort: {{ .Values.webService.targetPort }}
      protocol: TCP
  selector:
    {{- include "dcipm.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 4 }}
