{{- include "dcipm.guardAll" . -}}
{{- if .Values.serviceAccount.create -}}
{{- /*
Service account for both workloads.

NO Role and NO RoleBinding are created, and automountServiceAccountToken is
false: neither the API nor the web tier calls the Kubernetes API. The pod
therefore has no credential to the control plane at all â€” least privilege by
absence rather than by a carefully-scoped RBAC rule that has to be maintained.

If a future feature needs the API (for example an operator UI listing pods), add
a narrowly scoped Role for that verb and resource, and turn token mounting on for
that workload only.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dcipm.serviceAccountName" . }}
  namespace: {{ include "dcipm.namespace" . }}
  labels:
    {{- include "dcipm.componentLabels" (dict "root" $ "component" "service-account") | nindent 4 }}
  {{- with (merge (default dict .Values.serviceAccount.annotations) (default dict .Values.commonAnnotations)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
