apiVersion: v2
name: ddc-innovation-pm
description: |
  DDC Innovation Portfolio Management (DCIPM) — a .NET 9 API and a React/nginx web
  tier, deployed behind pfSense HAProxy and RKE2 Traefik.

  TLS terminates OUTSIDE the cluster, so both workloads serve plain HTTP and the
  browser-facing scheme is carried by X-Forwarded-Proto. That single fact drives
  most of the chart's shape: the HTTPS-redirect gate is off, the trusted-proxy
  CIDR is the pod network, and there is no `tls:` block. Read values.yaml before
  changing any of those three, and run
  scripts/deploy/check-chart-guards.ps1 after (it fails the render on purpose for
  each of those mistakes).

  Secrets are referenced by NAME, not defined here (decision D10): the default
  render contains no Secret object and no credential value appears in a values
  file, in a rendered manifest, or in `helm get values`. `secrets.create` is the
  opt-in escape hatch for a fresh namespace, and it requires an explicit
  `secrets.takeOwnership` because creating the Secret hands it to Helm.
type: application

# Chart version: bump on any change to the chart itself.
version: 0.1.0
# The application release this chart was written against. Informational: the
# image tag is NOT derived from it (see values.yaml — the tag is required input,
# so a chart bump can never silently move what is deployed).
appVersion: "1.0.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - dcipm
  - ddc-innovation-pm
  - dotnet
  - react
home: https://github.com/ddc-innovation/ddc_innovation_portfollio_management
sources:
  - https://github.com/ddc-innovation/ddc_innovation_portfollio_management
maintainers:
  - name: Richard Stevens
    email: richard.stevens@ddc-dine.com
annotations:
