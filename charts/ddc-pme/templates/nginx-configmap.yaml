{{- if .Values.nginx.enabled }}
{{- /*
Kubernetes version of ddc-pme/nginx.conf (+ ddc-pme/nginx-security-headers.conf
and the runtime /env-config.js). Three files, each mounted with subPath over the
image's copy:
  default.conf          -> /etc/nginx/conf.d/default.conf
  security-headers.conf -> /etc/nginx/snippets/security-headers.conf
  env-config.js         -> /usr/share/nginx/html/env-config.js

What differs from the docker-compose nginx.conf, and why:
  * the docker embedded-DNS resolver -> nginx.resolver (CoreDNS).
  * the compose service-name upstream -> the API Service's FQDN,
    http://<fullname>-api.<namespace>.svc.<clusterDomain>:<port>.
  * X-Forwarded-Proto / -Port are PRESERVED when present. In this cluster the
    browser's TLS ends at pfSense, which forwards to Traefik over HTTP; Traefik
    trusts pfSense (rke2-traefik forwardedHeaders.trustedIPs, set by
    digin-automation rancher-web-ui) and passes the headers on. Using $scheme
    here would tell the API every request was plain http.
  * The CSP is rendered here (not copied from the image) because the SPA talks
    to Keycloak from the browser and the shipped `connect-src 'self'` would
    block the OIDC discovery/token calls.
  * client_max_body_size follows app.maxUploadBytes (the API's MAX_UPLOAD_BYTES).

KEEP IN SYNC with ddc-pme/nginx.conf and ddc-pme/nginx-security-headers.conf.
Helm cannot read files outside the chart directory, so they are inlined.
*/ -}}
{{- $connectSrc := list "'self'" -}}
{{- with (include "ddc-pme.oidcOrigin" .) }}{{- $connectSrc = append $connectSrc . }}{{- end -}}
{{- range .Values.nginx.extraConnectSrc }}{{- $connectSrc = append $connectSrc . }}{{- end -}}
{{- /*
`oidcOnly` decides whether the login page shows the email/password form. Without
it the deployed page keeps offering a form the API answers with 410
PASSWORD_GRANT_DISABLED in every environment, which reads as "SSO is broken"
when the form is simply a dead end.
*/ -}}
{{- $oidcConfig := dict
      "issuer" (include "ddc-pme.oidcIssuer" .)
      "clientId" .Values.keycloak.clientId
      "redirectUri" .Values.keycloak.redirectUri
      "postLogoutRedirectUri" .Values.keycloak.postLogoutRedirectUri
      "oidcOnly" .Values.keycloak.oidcOnly -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ddc-pme.nginxConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddc-pme.componentLabels" (dict "root" . "component" "nginx") | nindent 4 }}
data:
  default.conf: |
    # Managed by Helm (ddc-pme chart). Do not edit in the cluster.

    # Upload limit must match the API's MAX_UPLOAD_BYTES (app.maxUploadBytes).
    # If nginx rejects first, the API's own, better worded error never shows.
    client_max_body_size {{ .Values.app.maxUploadBytes | int64 }};

    # Preserve what the edge (pfSense -> Traefik) already set; fall back to this
    # hop's own view only when the header is absent (direct access, port-forward).
    map $http_x_forwarded_proto $pme_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_port $pme_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    # Upstream names are resolved at REQUEST time (variable in proxy_pass), so a
    # missing API Service never stops nginx from starting.
    resolver {{ .Values.nginx.resolver }} valid={{ .Values.nginx.resolverValid }} ipv6=off;

    server {
        listen {{ .Values.nginx.containerPort }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers. Any location with its own add_header MUST include
        # this file again (nginx stops inheriting server-level add_header).
        include /etc/nginx/snippets/security-headers.conf;

        # Liveness/readiness. Deliberately does NOT touch the API, so a backend
        # incident cannot get the frontend Pod restarted or removed.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API proxy. Must precede the SPA fallback. No URI part after the
        # variable: nginx then forwards the ORIGINAL request URI, which is what
        # the API's /api/v1 global prefix expects.
        location /api/v1/ {
            set $pme_api_upstream {{ include "ddc-pme.apiUpstream" . }};
            proxy_pass $pme_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Append this hop's client address to the chain from Traefik/pfSense.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $pme_forwarded_proto;
            proxy_set_header X-Forwarded-Port  $pme_forwarded_port;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Authorization     $http_authorization;
            proxy_pass_header Authorization;

            proxy_pass_header X-RateLimit-Limit;
            proxy_pass_header X-RateLimit-Remaining;
            proxy_pass_header Retry-After;

            # Uploads and report generation can be slow (default read timeout is 60s).
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Stream bodies instead of buffering uploads to disk.
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Content-hashed CRA assets: cache forever.
        location /static/ {
            expires 1y;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # index.html must never be cached (stale bundle -> blank page).
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }

        # Runtime OIDC config (window.__PME_CONFIG__), mounted from this ConfigMap.
        location = /env-config.js {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
            default_type application/javascript;
            try_files $uri =404;
        }

        # SPA fallback: client-side routes exist only in the router.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never serve dotfiles.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;
    }
  security-headers.conf: |
    # Managed by Helm. Same headers as ddc-pme/nginx-security-headers.conf; only
    # connect-src differs (adds the Keycloak origin and nginx.extraConnectSrc).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src {{ join " " $connectSrc }}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  env-config.js: |
    // Managed by Helm from .Values.keycloak. Loaded by index.html before the bundle.
    window.__PME_CONFIG__ = {{ toPrettyJson $oidcConfig | nindent 4 | trim }};
{{- end }}
