replicaCount: 1

image:
  repository: harbor.dinecodetalkers.com/app-mail/postfix-relay
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-postfix-pull

nameOverride: ""
fullnameOverride: ""

postfix:
  hostname: m365-mail-relay.dinecodetalkers.com
  allowedSender: No-Reply.AppMail@ddc-dine.com
  myNetworks:
    - 192.168.250.0/24
  existingSecret: postfix-smtp

service:
  type: NodePort
  port: 25
  nodePort: 30225
  externalTrafficPolicy: Cluster

persistence:
  storageClass: longhorn
  size: 10Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingressSourceCidrs:
    - 192.168.250.0/24
  dnsNamespace: kube-system
  dnsPodLabels:
    k8s-app: kube-dns
  observabilityNamespace: observability

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: monitoring

prometheusRule:
  enabled: true
  labels:
    release: monitoring

nodeSelector: {}
tolerations: []
affinity: {}


