apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postfix-relay.fullname" . }}-config
  labels:
    {{- include "postfix-relay.labels" . | nindent 4 }}
data:
  main.cf: |
    compatibility_level = 3.11

    myhostname = {{ .Values.postfix.hostname }}
    myorigin = $myhostname
    inet_interfaces = all
    inet_protocols = ipv4
    mynetworks = {{ concat (list "127.0.0.0/8") .Values.postfix.myNetworks | join ", " }}

    mydestination =
    alias_maps =
    alias_database =
    relayhost = [smtp.office365.com]:587
    local_transport = error:local delivery is disabled
    smtpd_relay_restrictions = permit_mynetworks, reject
    smtpd_client_restrictions = permit_mynetworks, reject
    smtpd_sender_restrictions = check_sender_access texthash:/etc/postfix/allowed_senders, reject
    header_checks = regexp:/etc/postfix/header_checks
    disable_vrfy_command = yes
    smtpd_helo_required = yes
    smtpd_forbid_bare_newline = yes
    smtpd_forbid_unauth_pipelining = yes

    smtp_sasl_auth_enable = yes
    smtp_sasl_password_maps = texthash:/run/postfix/sasl_passwd
    smtp_sasl_security_options = noanonymous
    smtp_sasl_tls_security_options = noanonymous
    smtp_sasl_mechanism_filter = login, plain
    smtp_tls_security_level = encrypt
    smtp_tls_CAfile = /etc/pki/tls/certs/ca-bundle.crt
    smtp_tls_loglevel = 1
    smtp_tls_session_cache_database =
    smtp_tls_verify_cert_match = nexthop

    smtpd_tls_security_level = none

    maillog_file = /run/postfix/maillog
    maillog_file_prefixes = /var, /dev/stdout, /run/postfix
    data_directory = /var/lib/postfix
    queue_directory = /var/spool/postfix
    default_database_type = texthash

    import_environment = MAIL_CONFIG MAIL_DEBUG MAIL_LOGTAG TZ XAUTHORITY DISPLAY LANG=C POSTLOG_SERVICE POSTLOG_HOSTNAME XDG_RUNTIME_DIR LD_PRELOAD=$shlib_directory/fake_eugid.so

    message_size_limit = 26214400
    mailbox_size_limit = 0
    recipient_delimiter = +
    maximal_queue_lifetime = 5d
    bounce_queue_lifetime = 5d
  master.cf: |
    # service type  private unpriv  chroot  wakeup  process_limit command + args
    2525      inet  n       -       n       -       -             smtpd
    anvil     unix  -       -       n       -       1             anvil
    pickup    unix  n       -       n       60      1             pickup
    cleanup   unix  n       -       n       -       0             cleanup
    qmgr      unix  n       -       n       300     1             qmgr
    tlsmgr    unix  -       -       n       1000?   1             tlsmgr
    rewrite   unix  -       -       n       -       -             trivial-rewrite
    bounce    unix  -       -       n       -       0             bounce
    defer     unix  -       -       n       -       0             bounce
    trace     unix  -       -       n       -       0             bounce
    verify    unix  -       -       n       -       1             verify
    flush     unix  n       -       n       1000?   0             flush
    proxymap  unix  -       -       n       -       -             proxymap
    proxywrite unix -       -       n       -       1             proxymap
    postlog   unix-dgram n   -       n       -       1             postlogd
    smtp      unix  -       -       n       -       -             smtp
    relay     unix  -       -       n       -       -             smtp
    showq     unix  n       -       n       -       -             showq
    error     unix  -       -       n       -       -             error
    retry     unix  -       -       n       -       -             error
    discard   unix  -       -       n       -       -             discard
    scache    unix  -       -       n       -       1             scache
  allowed_senders: |
    {{ .Values.postfix.allowedSender }} OK
  header_checks: |
    /^From:([^<]*<)?[[:space:]]*{{ .Values.postfix.allowedSender | regexQuoteMeta }}[[:space:]]*(>)?[[:space:]]*$/ DUNNO
    /^From:/ REJECT The From header must use {{ .Values.postfix.allowedSender }}

