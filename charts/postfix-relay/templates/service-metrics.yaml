apiVersion: v1
kind: Service
metadata:
  name: {{ include "postfix-relay.fullname" . }}-metrics
  labels:
    {{- include "postfix-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "postfix-relay.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      protocol: TCP
      port: 9154
      targetPort: metrics


