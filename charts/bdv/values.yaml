# Offline rendering is enabled by default. Live installation is deliberately gated.
# See docs/BLOCKERS.md before changing these fields.
deployment:
  enabled: false
  evidenceConfirmed: false
  domainsConfirmed: false
  proxyBoundaryConfirmed: false
nameOverride: ""
imagePullSecrets: []
# Set this to the actual downstream version, independently of Rancher's version.
kubernetesVersion: "1.36.4"
ingress:
  # Enable only after DNS, authentication, and the proxy boundary are verified.
  enabled: false
  # Verified against the live RKE2 cluster on 2026-10-18.
  className: traefik
  annotations: {}
  # Verify DNS and certificates before enabling ingress.
  bdvHost: bdv.dinecodetalkers.com
  rangerHost: bdv-policy-manager.dinecodetalkers.com
storage:
  className: longhorn
  minioSize: 100Gi
  accessModes: [ReadWriteOnce]
  # Retain PVC by default. Existing claim is useful during reinstall.
  existingMinioClaim: ""
objectStorage:
  # Runtime profiles select minio or aws-s3. Credentials remain in a Secret.
  provider: minio
  bucket: bdv-warehouse
  # Additional buckets share the retained workload identity, with a separate policy.
  additionalBuckets: []
  region: us-east-1
  # Empty for AWS S3. MinIO uses the in-cluster Service generated by the chart.
  endpoint: ""
  pathStyleAccess: true
  # Required keys: accessKey and secretKey.
  credentialsSecret: bdv-warehouse-s3
bootstrap:
  # Provision DBs/credential Secrets without deploying applications.
  only: false
  image:
    repository: rstevens198238/bdv-bootstrap
    tag: "0.1.1"
    digest: "sha256:a0285ef33f12a2888adccfeb0a611329d977798b6cee6a1bf068e1ceedd11975"
  adminSecret: bdv-mysql-admin
  # Keys username/password; application pods never mount this Secret.
  caSecret: bdv-mysql-ca
  caKey: ca.crt
  host: "192.168.250.15"
  port: 3306
  sslMode: REQUIRED
  accountHost: "192.168.250.0/255.255.255.0"
  timeoutSeconds: 600
  backoffLimit: 2
  # Names are stable, external to Helm, and retained on uninstall.
  hive: {secret: bdv-hive-db, database: bdv_hive, username: bdv_hive}
  ranger: {secret: bdv-ranger-db, database: bdv_ranger, username: bdv_ranger}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
minio:
  enabled: true
  image:
    repository: rstevens198238/pme-minio
    tag: d3bd29c8126e
    digest: sha256:eacd3dc98e269e30b88ed10df48560b8b9e7484465912724bedaecf8d5c9936a
  # Secret includes MINIO_ROOT_USER, MINIO_ROOT_PASSWORD; only MinIO and init use it.
  adminSecret: bdv-minio-admin
  port: 9000
  consolePort: 9001
  # Verified bucket/user/policy initializer image and argv, required for live use.
  initImage:
    repository: rstevens198238/bdv-minio-init
    tag: 0.1.1
    digest: sha256:043c62faf5a22d57bdd521e8ed8ef5c78812a89e5faa066749e14f59a9ced63c
  initCommand: [/usr/local/bin/bdv-minio-init]
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: '2', memory: 2Gi}
hive:
  # Explicitly create through scripts/manage-storage.py after authorization.
  schemas: []
  # Hive 3.1.3 derivative with verified Connector/J 9.7.0 and S3 libraries.
  image:
    repository: rstevens198238/mdaca-metastore
    tag: hive-3.1.3-mysql-9.7.0-0.1.1
    digest: sha256:41b722eb180b952537cc0fb3d40eb5db7a52b7b57a4af86d2e3a430ed849eeb5
  port: 9083
  # Optional non-secret image-compatible configuration overlays. The wrapper
  # generates protected hive-site.xml/core-site.xml from mounted Secrets.
  configSecret: ""
  configMountPath: /config
  schemaCommand: [/usr/local/bin/bdv-hive, schema]
  command: [/usr/bin/tini, --, /usr/local/bin/bdv-hive, run]
  readinessCommand: [/usr/local/bin/bdv-hive, check]
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: '2', memory: 2Gi}
ranger:
  # Populated from the pinned vendor image by prepare-ranger-config.sh --values.
  # Contains substitution tokens, not live credentials.
  installPropertiesTemplate: ""
  # Extra password-free vendor install.properties overrides, rendered by Helm.
  installProperties: {}
  authorization:
    enabled: false
    serviceName: bdv-trino
    # Reconcile adds missing definitions, users and grants. It never deletes
    # unrelated policies or revokes users merely removed from this values list.
    serviceType: trino
    serviceConfigs:
      username: trino-healthcheck
      jdbc.driverClassName: io.trino.jdbc.TrinoDriver
      jdbc.url: jdbc:trino://bdv-coordinator:8080
    users:
      - trino-healthcheck
      - richard.stevens@ddc-dine.com
      - michael.peterson@ddc-dine.com
    resourceParents:
      catalog: {parent: null, level: 10}
      schema: {parent: catalog, level: 20}
      table: {parent: schema, level: 30}
      column: {parent: table, level: 40}
      trinouser: {parent: null, level: 10}
      procedure: {parent: schema, level: 30}
      systemproperty: {parent: null, level: 10}
      sessionproperty: {parent: catalog, level: 20}
      schemafunction: {parent: schema, level: 30}
      role: {parent: null, level: 10}
      queryid: {parent: null, level: 10}
      sysinfo: {parent: null, level: 10}
    accessTypes: [create, drop, select, insert, delete, use, alter, all, grant, revoke, show, impersonate, execute, read_sysinfo, write_sysinfo]
    # Self policies are generated one user at a time, never cross-impersonation.
    selfImpersonation: true
    # Optional fresh-install smoke creator. Set to a listed Keycloak username
    # before running test-managed.py --sql create-smoke; exact test table only.
    smokeCreator: ''
    # Appended to grants by the reconciler, preserving inherited health checks.
    additionalGrants: []
    grants:
      - name: trino-healthcheck-query
        resources: {queryid: ['*']}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [execute]
      - name: trino-healthcheck-hive-catalog
        resources: {catalog: [hive]}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [use]
      - name: trino-healthcheck-default-schema
        resources: {catalog: [hive], schema: [default]}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [show]
      - name: trino-healthcheck-schema-metadata
        resources: {catalog: [hive], schema: [information_schema], table: [schemata], column: [schema_name]}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [select]
      - name: trino-healthcheck-table-metadata
        resources: {catalog: [hive], schema: [information_schema], table: [tables], column: [table_schema, table_name]}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [select]
      - name: trino-healthcheck-smoke-table-20261019
        resources: {catalog: [hive], schema: [default], table: [bdv_smoke_20261019]}
        users: [trino-healthcheck]
        accesses: [create, insert, select, show]
      - name: bdv-smoke-table-writers
        resources: {catalog: [hive], schema: [default], table: [bdv_smoke_20261019]}
        users: [richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [insert, delete, drop]
      - name: trino-healthcheck-smoke-columns-20261019
        resources: {catalog: [hive], schema: [default], table: [bdv_smoke_20261019], column: [probe_id, note]}
        users: [trino-healthcheck, richard.stevens@ddc-dine.com, michael.peterson@ddc-dine.com]
        accesses: [select]
  # 0.2.3 lets vendor setup own the Connector/J copy into WEB-INF/lib.
  image:
    repository: rstevens198238/mdaca-policy-manager
    tag: "vendor-init-0.2.3"
    digest: "sha256:1112b6976a88393d863754d37b69258789cd34a608fdc1719fd4fdbfeec5024e"
  # The init-only Secret is consumed by setup.sh and converted to JCEKS aliases.
  credentialsSecret: bdv-ranger-credentials
  port: 6080
  # Password-free install.properties template prepared as an external ConfigMap.
  configMap: bdv-ranger-config
  configMountPath: /config
  schemaCommand: [/opt/bdv-ranger/bin/ranger-init]
  command: [/opt/bdv-policy-manager/ews/ranger-admin-services.sh, run]
  # Ranger redirects the root path to its login page. curl --fail accepts 302
  # and rejects HTTP errors; --max-time bounds startup/readiness execution.
  readinessCommand: [/usr/bin/curl, --fail, --silent, --show-error, --output, /dev/null, --max-time, "3", http://127.0.0.1:6080/]
  # No local persistent path has been verified. Add approved mounts through chart changes.
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: '2', memory: 3Gi}
bdv:
  jvm:
    initialRAMPercentage: 25
    maxRAMPercentage: 65
    queryMemoryPercentageOfLimit: 30
    heapHeadroomPercentageOfLimit: 20
  workerResources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: '2', memory: 4Gi}
  workerShutdown:
    # Opt in after checking the pinned image's internal authentication contract.
    enabled: false
    terminationGracePeriodSeconds: 900
    waitSeconds: 840
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # Keep automatic scale-down disabled until graceful drain is live-tested.
    # CPU scaling does not predict query queues or provision Kubernetes nodes.
    scaleDownEnabled: false
    scaleDownStabilizationSeconds: 600
  # Opt-in only after preparing a separate coordinator config Secret.
  # OAuth client Secret keys: issuer, clientId, clientSecret.
  # Internal Secret key: sharedSecret. See docs/OAUTH-STAGED.md.
  oauth2:
    enabled: false
  image:
    repository: rstevens198238/mdaca-bdv
    tag: ""
    digest: "sha256:5e2bfadf0ae1e159f2105c84fc97ff124a7ad9de1571ac22e070377e0a18e5cc"
  port: 8080
  # Stage the verified coordinator first; enable workers after a live worker test.
  workers: 0
  command: ["/__cacert_entrypoint.sh", "/usr/lib/trino/bin/run-trino"]
  readinessCommand:
    - /usr/bin/bash
    - -ec
    - |
      if [[ "${BDV_CHECK_MODE:-}" == prerequisites ]]; then
        test -s /etc/trino/config.properties
        test -s /etc/trino/node.properties
        test -s /etc/trino/jvm.config
        test -s /etc/trino/catalog/hive.properties
        test -s /plugin/access-control.properties
        test -s /plugin/ranger-trino-security.xml
        exit 0
      fi
      timeout 5s /usr/bin/bash -ec '
        exec 3<>/dev/tcp/127.0.0.1/8080
        printf "GET /v1/info HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
        IFS= read -r status <&3
        [[ "$status" =~ ^HTTP/1\.[01][[:space:]]200[[:space:]] ]]
        info="$(cat <&3)"
        [[ "$info" =~ \"starting\"[[:space:]]*:[[:space:]]*false ]]
      '
  # Mount protected config files; the dev profile starts with a single tested coordinator.
  coordinatorConfigSecret: bdv-coordinator-config
  workerConfigSecret: bdv-worker-config
  # Dedicated connector account, never the Hive/Ranger database accounts.
  catalogSecret: bdv-catalogs
  mysqlConnectorSecret: bdv-mysql-connector
  keycloakSecret: bdv-keycloak
  pluginSecret: bdv-ranger-plugin
  internalSecret: bdv-internal
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: '2', memory: 4Gi}
validation:
  # An executable local adapter with verified tools/authentication, supplied at runtime.
  # No password is accepted in argv. Adapter reads existing Secrets or protected files.
  adapter: ""
keycloak:
  issuer: https://sso.dinecodetalkers.com/realms/innonet
  clientId: bdv

# Non-secret configuration is authored here and rendered into ConfigMaps.
# Keep false to retain the older externally prepared Secret configuration.
# Helm expressions below derive release names/endpoints. ${ENV:...} values are
# resolved inside Trino using Secret-backed environment variables, not by Helm.
configuration:
  managed: false
  files:
    coordinator:
      config.properties: |
        coordinator=true
        node-scheduler.include-coordinator={{ if or .Values.bdv.autoscaling.enabled (gt (int .Values.bdv.workers) 0) }}false{{ else }}true{{ end }}
        http-server.http.port={{ .Values.bdv.port }}
        discovery.uri=http://{{ include "bdv.fullname" . }}-coordinator:{{ .Values.bdv.port }}
        catalog.management=static
        access-control.config-files=/plugin/access-control.properties
        query.max-memory-per-node={{ include "bdv.memoryBudget" (dict "memory" .Values.bdv.resources.limits.memory "percent" .Values.bdv.jvm.queryMemoryPercentageOfLimit) }}B
        memory.heap-headroom-per-node={{ include "bdv.memoryBudget" (dict "memory" .Values.bdv.resources.limits.memory "percent" .Values.bdv.jvm.heapHeadroomPercentageOfLimit) }}B
        {{ if .Values.bdv.oauth2.enabled }}
        http-server.authentication.type=oauth2
        web-ui.authentication.type=oauth2
        http-server.process-forwarded=true
        http-server.authentication.oauth2.issuer=${ENV:BDV_OIDC_ISSUER}
        http-server.authentication.oauth2.client-id=${ENV:BDV_OIDC_CLIENT_ID}
        http-server.authentication.oauth2.client-secret=${ENV:BDV_OIDC_CLIENT_SECRET}
        http-server.authentication.oauth2.principal-field=preferred_username
        http-server.authentication.oauth2.scopes=openid,profile,email
        {{ end }}
        internal-communication.shared-secret=${ENV:BDV_INTERNAL_SHARED_SECRET}
      node.properties: |
        node.environment=bdv
        node.data-dir=/work/trino
      jvm.config: &trinoJvm |
        -server
        -agentpath:/usr/lib/trino/bin/libjvmkill.so
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage={{ .Values.bdv.jvm.initialRAMPercentage }}
        -XX:MaxRAMPercentage={{ .Values.bdv.jvm.maxRAMPercentage }}
        -XX:G1HeapRegionSize=32M
        -XX:+ExplicitGCInvokesConcurrent
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:+ExitOnOutOfMemoryError
        -XX:-OmitStackTraceInFastThrow
        -XX:ReservedCodeCacheSize=256M
        -XX:PerMethodRecompilationCutoff=10000
        -XX:PerBytecodeRecompilationCutoff=10000
        -Djdk.attach.allowAttachSelf=true
        -Djdk.nio.maxCachedBufferSize=2000000
      log.properties: |
        io.trino=INFO
    worker:
      config.properties: |
        coordinator=false
        http-server.http.port={{ .Values.bdv.port }}
        discovery.uri=http://{{ include "bdv.fullname" . }}-coordinator:{{ .Values.bdv.port }}
        catalog.management=static
        query.max-memory-per-node={{ include "bdv.memoryBudget" (dict "memory" .Values.bdv.workerResources.limits.memory "percent" .Values.bdv.jvm.queryMemoryPercentageOfLimit) }}B
        memory.heap-headroom-per-node={{ include "bdv.memoryBudget" (dict "memory" .Values.bdv.workerResources.limits.memory "percent" .Values.bdv.jvm.heapHeadroomPercentageOfLimit) }}B
        internal-communication.shared-secret=${ENV:BDV_INTERNAL_SHARED_SECRET}
      node.properties: |
        node.environment=bdv
        node.data-dir=/work/trino
      jvm.config: *trinoJvm
      log.properties: |
        io.trino=INFO
    catalog:
      hive.properties: |
        connector.name=hive
        hive.metastore.uri=thrift://{{ include "bdv.fullname" . }}-hive:{{ .Values.hive.port }}
        fs.native-s3.enabled=true
        {{ if eq .Values.objectStorage.provider "minio" }}
        s3.endpoint=http://{{ include "bdv.fullname" . }}-minio:{{ .Values.minio.port }}
        {{ else if .Values.objectStorage.endpoint }}
        s3.endpoint={{ .Values.objectStorage.endpoint }}
        {{ end }}
        s3.region={{ .Values.objectStorage.region }}
        s3.path-style-access={{ .Values.objectStorage.pathStyleAccess }}
        s3.aws-access-key=${ENV:BDV_S3_ACCESS_KEY}
        s3.aws-secret-key=${ENV:BDV_S3_SECRET_KEY}
    plugin:
      access-control.properties: |
        access-control.name=ranger
        ranger.service.name={{ .Values.ranger.authorization.serviceName }}
        ranger.plugin.config.resource=/plugin/ranger-trino-security.xml,/plugin/ranger-trino-audit.xml
        ranger.hadoop.config.resource=/plugin/core-site.xml
      ranger-trino-security.xml: |
        <?xml version="1.0"?>
        <configuration>
          <property><name>ranger.plugin.trino.policy.rest.url</name><value>http://{{ include "bdv.fullname" . }}-ranger:{{ .Values.ranger.port }}</value></property>
          <property><name>ranger.plugin.trino.policy.source.impl</name><value>org.apache.ranger.admin.client.RangerAdminRESTClient</value></property>
          <property><name>ranger.plugin.trino.policy.pollIntervalMs</name><value>30000</value></property>
          <property><name>ranger.plugin.trino.policy.cache.dir</name><value>/work/ranger-policy-cache</value></property>
          <property><name>ranger.plugin.trino.policy.rest.client.connection.timeoutMs</name><value>30000</value></property>
          <property><name>ranger.plugin.trino.policy.rest.client.read.timeoutMs</name><value>30000</value></property>
        </configuration>
      ranger-trino-audit.xml: |
        <?xml version="1.0"?>
        <configuration>
          <property><name>xasecure.audit.is.enabled</name><value>true</value></property>
          <property><name>xasecure.audit.destination.log4j</name><value>true</value></property>
          <property><name>xasecure.audit.destination.log4j.logger</name><value>xa.audit</value></property>
          <property><name>xasecure.audit.destination.solr</name><value>false</value></property>
          <property><name>xasecure.audit.destination.hdfs</name><value>false</value></property>
        </configuration>
      core-site.xml: |
        <?xml version="1.0"?>
        <configuration><property><name>hadoop.security.authentication</name><value>simple</value></property></configuration>
