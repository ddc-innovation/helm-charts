apiVersion: v2
name: bdv
description: BDV solution accelerator with Trino, Ranger, Hive Metastore, optional MinIO, and optional Percona.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - bdv
  - trino
  - ranger
  - hive
  - minio
  - percona
home: https://github.com/ddc/ddc-solution-accelerators
sources:
  - https://github.com/ddc/ddc-solution-accelerators
maintainers:
  - name: DDC
dependencies:
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: ps-operator
    alias: perconaOperator
    version: "0.12.0"
    repository: https://percona.github.io/percona-helm-charts/
    condition: perconaOperator.enabled
  - name: ps-db
    alias: perconaDb
    version: "0.12.0"
    repository: https://percona.github.io/percona-helm-charts/
    condition: perconaDb.enabled

