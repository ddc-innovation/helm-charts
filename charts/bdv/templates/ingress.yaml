{{- if .Values.deployment.enabled }}
{{- $n := include "bdv.fullname" . }}
{{- range $component := list "coordinator" "ranger" "minio" }}
{{- $host := $.Values.ingress.bdvHost }}
{{- $port := $.Values.bdv.port }}
{{- if eq $component "ranger" }}
{{- $host = $.Values.ingress.rangerHost }}
{{- $port = $.Values.ranger.port }}
{{- else if eq $component "minio" }}
{{- $host = $.Values.ingress.minioHost }}
{{- $port = $.Values.minio.consolePort }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $n }}-{{ $component }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "bdv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $n }}-{{ $component }}
                port:
                  number: {{ $port }}
{{- end }}
{{- end }}