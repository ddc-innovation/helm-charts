{{- if and .Values.deployment.enabled .Values.minio.enabled }}
{{- $n := include "bdv.fullname" . }}
{{- $additional := .Values.objectStorage.additionalBuckets | default list }}
{{- if $additional }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-additional-buckets
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
data:
  reconcile.sh: |-
{{ .Files.Get "files/minio-additional-buckets.sh" | nindent 4 }}
---
{{- end }}
{{- if not .Values.storage.existingMinioClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $n }}-minio
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: {{ toYaml .Values.storage.accessModes | nindent 4 }}
  storageClassName: {{ .Values.storage.className }}
  resources: {requests: {storage: {{ .Values.storage.minioSize }}}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-minio
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ include "bdv.image" .Values.minio.image | quote }}
          args: [server, /data, --address, {{ printf ":%v" .Values.minio.port | quote }}, --console-address, {{ printf ":%v" .Values.minio.consolePort | quote }}]
          envFrom: [{secretRef: {name: {{ .Values.minio.adminSecret }}}}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: s3, containerPort: {{ .Values.minio.port }}}, {name: console, containerPort: {{ .Values.minio.consolePort }}}]
          startupProbe: {httpGet: {path: /minio/health/live, port: s3}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: s3}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /minio/health/live, port: s3}, periodSeconds: 20}
          resources: {{ toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: home, mountPath: /home/minio}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ default (printf "%s-minio" $n) .Values.storage.existingMinioClaim }}}
        - {name: home, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-buckets-{{ .Release.Revision }}
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: buckets
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: buckets}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buckets
          image: {{ include "bdv.image" .Values.minio.initImage | quote }}
          {{- if $additional }}
          command: [/bin/sh, -ec]
          args:
            - |-
              "$@"
              exec /bin/sh /storage-init/reconcile.sh
            - bdv-storage-init
            {{- range .Values.minio.initCommand }}
            - {{ . | quote }}
            {{- end }}
          {{- else }}
          command: {{ .Values.minio.initCommand | toJson }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: S3_ENDPOINT, value: {{ printf "http://%s-minio:%v" $n .Values.minio.port | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.objectStorage.bucket | quote }}}
            - {name: S3_REGION, value: {{ .Values.objectStorage.region | quote }}}
            {{- if $additional }}
            - {name: S3_ADDITIONAL_BUCKETS, value: {{ join " " $additional | quote }}}
            {{- end }}
          volumeMounts:
            - {name: admin, mountPath: /admin, readOnly: true}
            - {name: app, mountPath: /s3, readOnly: true}
            {{- if $additional }}
            - {name: storage-init, mountPath: /storage-init, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
      volumes:
        - name: admin
          secret: {secretName: {{ .Values.minio.adminSecret }}}
        - name: app
          secret: {secretName: {{ .Values.objectStorage.credentialsSecret }}}
        {{- if $additional }}
        - {name: storage-init, configMap: {name: {{ $n }}-additional-buckets}}
        {{- end }}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
{{- end }}
