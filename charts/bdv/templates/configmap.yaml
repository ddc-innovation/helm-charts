apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bdv.fullname" . }}-config
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
data:
  trino-coordinator.properties: |
    coordinator=true
    node-scheduler.include-coordinator=false
    http-server.http.port={{ .Values.trino.coordinator.service.port }}
    discovery.uri=http://{{ include "bdv.fullname" . }}-trino:{{ .Values.trino.coordinator.service.port }}
  trino-worker.properties: |
    coordinator=false
    http-server.http.port={{ .Values.trino.worker.service.port }}
    discovery.uri=http://{{ include "bdv.fullname" . }}-trino:{{ .Values.trino.coordinator.service.port }}
  hive-site.xml: |
    <configuration>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:mysql://{{ .Values.bdv.database.host }}:{{ .Values.bdv.database.port }}/{{ .Values.bdv.database.name }}</value>
      </property>
      <property>
        <name>metastore.warehouse.dir</name>
        <value>s3a://{{ .Values.bdv.objectStorage.bucket }}/warehouse</value>
      </property>
    </configuration>

