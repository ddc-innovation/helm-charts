{{- if .Values.ranger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bdv.fullname" . }}-ranger
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger
spec:
  replicas: {{ .Values.ranger.replicas }}
  selector:
    matchLabels:
      {{- include "bdv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ranger
  template:
    metadata:
      labels:
        {{- include "bdv.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ranger
    spec:
      serviceAccountName: {{ include "bdv.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ranger
          image: {{ include "bdv.image" (dict "root" . "image" .Values.ranger.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ranger.service.port }}
          env:
            - name: DATABASE_HOST
              value: {{ .Values.bdv.database.host | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.bdv.database.name | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bdv.database.existingSecret }}
                  key: {{ .Values.bdv.database.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bdv.database.existingSecret }}
                  key: {{ .Values.bdv.database.passwordKey }}
          resources:
            {{- toYaml .Values.ranger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bdv.fullname" . }}-ranger
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger
spec:
  type: {{ .Values.ranger.service.type }}
  selector:
    {{- include "bdv.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ranger
  ports:
    - name: http
      port: {{ .Values.ranger.service.port }}
      targetPort: http
{{- end }}

