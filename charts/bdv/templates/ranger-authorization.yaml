{{- if and .Values.deployment.enabled .Values.ranger.authorization.enabled }}
{{- $n := include "bdv.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-authorization
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
data:
  reconcile.py: |-
{{ .Files.Get "files/ranger-authorize.py" | nindent 4 }}
  desired.json: {{ toJson .Values.ranger.authorization | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-authorization-{{ .Release.Revision }}
  labels:
    {{- include "bdv.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-authorization
spec:
  activeDeadlineSeconds: 660
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "bdv.labels" . | nindent 8 }}
        app.kubernetes.io/component: ranger-authorization
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: configure
          image: {{ include "bdv.image" .Values.ranger.image | quote }}
          command: [python3, /operator/reconcile.py, /operator/desired.json]
          env:
            - {name: RANGER_URL, value: {{ printf "http://%s-ranger:%v" $n .Values.ranger.port | quote }}}
            - {name: HOME, value: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: code, mountPath: /operator, readOnly: true}
            - {name: credentials, mountPath: /ranger-credentials, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: code, configMap: {name: {{ $n }}-authorization}}
        - {name: credentials, secret: {secretName: {{ .Values.ranger.credentialsSecret | quote }}}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
{{- end }}
