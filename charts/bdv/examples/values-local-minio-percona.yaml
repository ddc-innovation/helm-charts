bdv:
  database:
    mode: percona
    host: bdv-mysql
    port: 3306
    name: bdv
    existingSecret: bdv-db
  objectStorage:
    mode: minio
    bucket: bdv
    region: us-east-1
    endpoint: http://bdv-minio:9000
    pathStyleAccess: true
    existingSecret: bdv-minio

minio:
  enabled: true
  mode: standalone
  rootUser: minioadmin
  rootPassword: minioadmin
  buckets:
    - name: bdv
      policy: none
      purge: false
      versioning: false

perconaOperator:
  enabled: true

perconaDb:
  enabled: true

