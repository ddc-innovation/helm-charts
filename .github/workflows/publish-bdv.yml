name: Publish BDV Helm chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/bdv/**'
      - 'scripts/release-bdv.py'
      - 'tests/test_release_bdv.py'
      - '.github/workflows/publish-bdv.yml'
  pull_request:
    branches: [main]
    paths:
      - 'charts/bdv/**'
      - 'scripts/release-bdv.py'
      - 'tests/test_release_bdv.py'
      - '.github/workflows/publish-bdv.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'minor: 0.1.34 to 0.2.0; patch: 0.1.34 to 0.1.35'
        type: choice
        options: [minor, patch]
        default: minor

permissions:
  contents: read

concurrency:
  group: bdv-helm-publishing-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python -m unittest discover -s tests -p 'test_release_bdv.py' -v
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Resolve dependencies and validate chart
        shell: bash
        run: |
          set -euo pipefail
          if test -f charts/bdv/Chart.lock; then
            helm dependency build charts/bdv
          else
            helm dependency update charts/bdv
          fi
          helm lint charts/bdv
          helm template bdv charts/bdv --namespace bdv > /dev/null

      - name: Run BDV regression tests
        env:
          HELM: helm
        run: bash charts/bdv/scripts/test-all.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out retained chart repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: .published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - name: Build the next chart release
        env:
          BUMP: ${{ inputs.bump || vars.BDV_CHART_BUMP || 'minor' }}
          REPOSITORY_URL: ${{ steps.pages.outputs.base_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/release-bdv.py \
            --chart charts/bdv --site .published \
            --url "$REPOSITORY_URL" --source-sha "$SOURCE_SHA" --bump "$BUMP"
      - name: Commit the package and index to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C .published config user.name 'github-actions[bot]'
          git -C .published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .published add .
          if ! git -C .published diff --cached --quiet; then
            git -C .published commit -m "Publish BDV chart from ${SOURCE_SHA}"
            git -C .published push origin HEAD:gh-pages
          fi
      - name: Prepare Pages files without Git metadata
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('.published', '_site', ignore=shutil.ignore_patterns('.git', '.github'))
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy the chart repository to Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
