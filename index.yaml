    created: "2026-11-25T16:40:25.271803274Z"
    description: 'DDC PME (Project Management Engine): nginx-served React SPA, NestJS
      API and worker, Redis and an optional MinIO, wired to a REMOTE Percona MySQL
      and an external Keycloak. All credentials come from pre-existing Secrets created
      in Rancher; this chart never creates a Secret.'
